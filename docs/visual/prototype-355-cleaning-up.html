<!doctype html>
<!--
  PROTOTYPE for #355 (throwaway, lives only on branch prototype/355-cleaning-up, never in main).
  Question: what should the "Cleaning up…" in-progress state look like, within the owner's direction (a):
  the disk bar shaves down at its right tip as space is freed, a "freed" count goes up beside it, and the
  category list ticks off below. Respects Reduce Motion. Design-system tokens only.
  Three variants on one page, switchable with ?variant=A|B|C, the floating bottom bar, or the ← → keys.
  Everything is fake: a simulated run of 8 items. No Swift code was touched.
-->
<html lang="en">

<style>
/* Tokens mirror CacheDrop/App/DesignSystem.swift (CacheDropDesign). Text colours and the window chrome come from
   docs/visual/preview.html (full mode), since SwiftUI takes those from the system. */
:root {
  color-scheme: light dark;
  --space-xs: 4px; --space-sm: 8px; --space-md: 12px; --space-lg: 16px; --space-xl: 24px; --space-page: 32px;
  --radius-row: 8px; --radius-surface: 12px;
  --size-meter-compact: 4px; --size-meter: 8px; --size-meter-prominent: 12px;
  --size-meter-gap: 2px; --size-meter-segment-min: 3px; --size-badge: 32px; --size-device-icon: 44px; --size-hairline: 1px;
  --opacity-badge-tint: .10; --opacity-meter-dimmed: .30; --opacity-waiting: .45;
  --font-page: 500 26px/1.25 -apple-system, BlinkMacSystemFont, sans-serif;
  --font-value: 500 22px/1.2 -apple-system, BlinkMacSystemFont, sans-serif;
  --font-section: 500 13px/1.35 -apple-system, BlinkMacSystemFont, sans-serif;
  --font-body: 400 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
  --font-callout: 400 12px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
  --font-caption: 400 10px/1.35 -apple-system, BlinkMacSystemFont, sans-serif;
  /* Motion: the app's only motion tokens are shimmer 2.4 s and waiting 0.2 s; the shave uses a guessed 0.6 s. */
  --motion-shave: 600ms;
  --motion-waiting: 200ms;

  --reading: light-dark(#FFFFFF, #171719);
  --summary: light-dark(#F7F8FA, #232328);
  --sidebar: light-dark(#FFFFFF, #242428);
  --selection: light-dark(#E5EDFA, #353E51);
  --blue: light-dark(#0877ED, #60A9FF);
  --purple: light-dark(#9360D8, #B290ED);
  --teal: light-dark(#2C8C8D, #61C3C2);
  --orange: light-dark(#BD7527, #E2A35E);
  --indigo: light-dark(#5856D6, #8583F5);
  --capacity-fill: light-dark(#969BA7, #858997);
  --capacity-track: light-dark(#ECEEF2, #33343D);
  --meter-other: light-dark(#5F6577, #B4B8C5);
  --meter-trash: light-dark(#C4C8D1, #5A5D69);
  --accent: light-dark(#007AFF, #0A84FF);          /* .accentColor (system blue) */
  --success: light-dark(#34C759, #30D158);         /* StatusRole.success = .green */
  --caution: light-dark(#FF9500, #FF9F0A);         /* StatusRole.caution = .orange */
  --text: light-dark(#202126, #F3F3F5);            /* preview.html --st-text */
  --secondary: light-dark(#686B75, #A6A7B2);       /* preview.html --st-secondary */
  --separator: light-dark(#E7E8EC, #34343C);       /* preview.html --st-line */
  --chrome: light-dark(#F8F9FB, #26262C);
  --shadow: light-dark(#1B284B12, #00000040);
  --highlight: light-dark(#FFFFFFD9, #FFFFFF14);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: light-dark(#E9EBF0, #0E0E10); color: var(--text); font: var(--font-body); padding: 44px 16px 120px; }
.numeric { font-variant-numeric: tabular-nums; white-space: nowrap; }
.secondary { color: var(--secondary); }
.caption { font: var(--font-caption); }
.callout { font: var(--font-callout); }
.section { font: var(--font-section); }
svg.icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* PROTOTYPE marking */
.proto-ribbon { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: repeating-linear-gradient(45deg, #FFD60A, #FFD60A 14px, #1C1C1E 14px, #1C1C1E 28px); padding: 4px 0; }
.proto-ribbon span { display: block; width: max-content; margin: 0 auto; background: #1C1C1E; color: #FFD60A; font: 600 11px/1.6 ui-monospace, Menlo, monospace; letter-spacing: .08em; padding: 2px 12px; border-radius: 4px; }

/* Window, after preview.html's .st-window */
.window { max-width: 980px; margin: 0 auto; background: var(--reading); border: 1px solid var(--separator); border-radius: 19px; overflow: hidden; box-shadow: 0 16px 48px var(--shadow), inset 0 1px 0 var(--highlight); }
.chrome { display: grid; grid-template-columns: 190px minmax(0, 1fr); min-height: 52px; background: var(--chrome); border-bottom: 1px solid var(--separator); }
.lights { display: flex; align-items: center; gap: 8px; padding: 0 21px; }
.lights span { width: 12px; height: 12px; border-radius: 50%; }
.lights span:nth-child(1) { background: #FF6058; } .lights span:nth-child(2) { background: #FEBC2E; } .lights span:nth-child(3) { background: #28C840; }
.toolbar { display: flex; align-items: center; padding: 0 24px; font: var(--font-section); }
.layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); min-height: 640px; }
.sidebar { background: var(--sidebar); border-right: 1px solid var(--separator); padding: 19px 12px; display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 9px 24px; font: 500 17px/1 -apple-system, sans-serif; letter-spacing: -.4px; }
.brand-mark { width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(145deg, #90BDFF, #5484E8 60%, #746DE1); }
.nav { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: var(--radius-row); color: var(--secondary); }
.nav[aria-current] { background: var(--selection); color: var(--text); }
.nav svg { color: var(--blue); }
.main { display: flex; flex-direction: column; min-width: 0; background: var(--reading); }
.page { flex: 1; padding: var(--space-page); display: flex; flex-direction: column; gap: var(--space-xl); }
h1 { margin: 0; font: var(--font-page); letter-spacing: -.6px; }
.subtitle { font: var(--font-callout); color: var(--secondary); margin-top: var(--space-xs); }

/* ActionStrip */
.strip { display: flex; align-items: center; gap: var(--space-md); border-top: 1px solid var(--separator); padding: var(--space-md) var(--space-page); min-height: 56px; }
.strip .note { flex: 1; font: var(--font-caption); color: var(--secondary); }
.btn { font: var(--font-body); border: 1px solid var(--separator); background: var(--summary); color: var(--text); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
.btn.prominent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: var(--opacity-waiting); cursor: default; }

/* SummarySurface */
.surface { background: var(--summary); border: 1px solid var(--separator); border-radius: var(--radius-surface); padding: var(--space-lg); }

/* The meter (#343): grey used fill, the detected part at the right tip of the used space, free space is the track.
   Pieces are absolutely placed so the same component can show the whole disk or a magnified window of it. */
.meter { position: relative; background: var(--capacity-track); border-radius: 999px; overflow: hidden; }
.meter.prominent { height: var(--size-meter-prominent); }
.meter.regular { height: var(--size-meter); }
.meter .piece { position: absolute; top: 0; bottom: 0; transition: left var(--motion-shave) cubic-bezier(.3,.7,.2,1), width var(--motion-shave) cubic-bezier(.3,.7,.2,1), background-color var(--motion-shave) ease; }
.meter .used-clip { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 999px; overflow: hidden; transition: width var(--motion-shave) cubic-bezier(.3,.7,.2,1); }
.meter.lens .used-clip { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.meter .piece.rest { background: var(--capacity-fill); }
.meter .piece.active { animation: waiting 1.4s ease-in-out infinite alternate; }
@keyframes waiting { to { opacity: var(--opacity-waiting); } }

/* Category badge */
.badge { width: var(--size-badge); height: var(--size-badge); border-radius: var(--radius-row); display: grid; place-items: center; flex: none; color: var(--c); background: color-mix(in srgb, var(--c) calc(var(--opacity-badge-tint) * 100%), transparent); }

/* Row status glyphs */
.status { width: 16px; height: 16px; flex: none; display: grid; place-items: center; }
.status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--capacity-track); box-shadow: inset 0 0 0 1px var(--capacity-fill); }
.status .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--capacity-track); border-top-color: var(--accent); animation: spin .9s linear infinite; }
.status .working { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.status .ok { color: var(--success); } .status .skip { color: var(--caution); } .status .none { color: var(--secondary); }
@keyframes spin { to { transform: rotate(360deg); } }
.status .ok svg, .status .skip svg, .status .none svg { width: 16px; height: 16px; }
.tick-in { animation: tick .35s cubic-bezier(.3,1.4,.5,1); }
@keyframes tick { from { transform: scale(.4); opacity: 0; } }

/* Reduce Motion: nothing moves; values step. */
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { transition: none !important; animation: none !important; }

/* ---------- Variant A: device card, freed tag riding the tip ---------- */
.a-top { display: flex; align-items: flex-start; gap: var(--space-md); }
.device-icon { width: var(--size-device-icon); height: var(--size-device-icon); border-radius: var(--radius-row); border: .5px solid var(--separator); background: linear-gradient(var(--reading), var(--summary)); display: grid; place-items: center; color: var(--secondary); }
.a-avail { margin-left: auto; text-align: right; }
.a-avail strong { display: block; font: var(--font-value); }
.a-meter-wrap { position: relative; margin-top: var(--space-xl); padding-top: 26px; }
.a-tag { position: absolute; top: 0; transform: translateX(-100%); white-space: nowrap; font: var(--font-callout); font-weight: 500; transition: left var(--motion-shave) cubic-bezier(.3,.7,.2,1); padding-right: 6px; border-right: var(--size-hairline) solid var(--secondary); height: 34px; line-height: 18px; }
.a-tag.pinned { position: static; transform: none; border: 0; padding: 0; height: auto; }
.a-foot { display: flex; justify-content: space-between; gap: var(--space-md); margin-top: var(--space-md); }
.a-list { border: 1px solid var(--separator); border-radius: var(--radius-surface); overflow: hidden; }
.a-row { display: grid; grid-template-columns: 16px var(--size-badge) minmax(0, 1fr) auto; gap: var(--space-md); align-items: center; padding: var(--space-md) var(--space-lg); border-bottom: 1px solid var(--separator); transition: background-color var(--motion-shave); }
.a-row:last-child { border-bottom: 0; }
.a-row.current { background: color-mix(in srgb, var(--selection) 55%, transparent); }
.a-row .size { text-align: right; }
.a-row.waiting .badge, .a-row.waiting .title { opacity: var(--opacity-waiting); }
.a-done { display: flex; align-items: center; gap: var(--space-sm); font: var(--font-callout); }

/* ---------- Variant B: counter beside the bar, live log ---------- */
.b-hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-xl); align-items: center; }
.b-count strong { display: block; font: var(--font-page); letter-spacing: -.6px; }
.b-bar-col .row { display: flex; justify-content: space-between; margin-top: var(--space-sm); }
.b-now { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md) 0; border-top: 1px solid var(--separator); border-bottom: 1px solid var(--separator); }
.b-now .grow { flex: 1; min-width: 0; }
.b-log { display: flex; flex-direction: column; }
.b-entry { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: var(--space-md); align-items: center; padding: var(--space-sm) 0; }
.b-entry.enter { animation: enter .4s cubic-bezier(.3,.7,.2,1); }
@keyframes enter { from { opacity: 0; transform: translateY(-6px); } }
.b-cat { margin-top: var(--space-md); }
.b-cat:first-child { margin-top: 0; }
.b-catline { display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-sm) 0; border-bottom: 1px solid var(--separator); }
.b-catline .sw { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.b-more { padding: var(--space-sm) 0 0 28px; }

/* ---------- Variant C: magnified tip + receipt ---------- */
.c-whole { display: flex; align-items: center; gap: var(--space-md); }
.c-whole .meter { flex: 1; }
.c-lens-wrap { position: relative; margin-top: var(--space-sm); }
.c-lens-guides { height: 14px; position: relative; }
.c-lens-guides svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.c-lens-head { display: flex; justify-content: space-between; align-items: baseline; margin: var(--space-sm) 0 var(--space-sm); }
.c-lens-head strong { font: var(--font-value); }
.c-lens-scale { display: flex; justify-content: space-between; margin-top: var(--space-xs); }
.c-receipt { border-top: 1px solid var(--separator); }
.c-line { display: grid; grid-template-columns: 16px minmax(0, 1fr) 96px 80px; gap: var(--space-md); align-items: baseline; padding: var(--space-sm) 0; border-bottom: 1px dashed var(--separator); }
.c-line .amt, .c-line .run { text-align: right; }
.c-line.head { border-bottom: 1px solid var(--separator); padding-top: var(--space-md); }
.c-line.struck .amt { text-decoration: line-through; color: var(--secondary); }
.c-total { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-md); padding: var(--space-md) 0 0; border-top: 2px solid var(--text); margin-top: -1px; clip-path: inset(0 100% 0 0); transition: clip-path 700ms ease; }
.c-total.show { clip-path: inset(0 0 0 0); }
.c-total strong { font: var(--font-value); }

/* ---------- Prototype controls (deliberately not CacheDrop's look) ---------- */
.switcher { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 32px); background: #1C1C1E; color: #F2F2F7; padding: 6px 8px; border-radius: 999px; box-shadow: 0 8px 28px #0007, 0 0 0 1px #FFD60A88; font: 500 12px/1 ui-monospace, Menlo, monospace; }
.switcher button, .switcher select { font: inherit; color: inherit; background: #3A3A3C; border: 0; border-radius: 999px; padding: 6px 10px; cursor: pointer; }
.switcher .label { padding: 0 6px; min-width: 190px; text-align: center; color: #FFD60A; }
.switcher label { display: flex; align-items: center; gap: 4px; padding: 0 4px; }
.switcher .sep { width: 1px; height: 18px; background: #48484A; }
.statepanel { max-width: 980px; margin: 16px auto 0; overflow: auto; background: #1C1C1EEE; color: #D1D1D6; font: 11px/1.45 ui-monospace, Menlo, monospace; padding: 10px 12px; border-radius: 10px; box-shadow: 0 0 0 1px #FFD60A66; white-space: pre; }
.statepanel b { color: #FFD60A; font-weight: 600; }
.statepanel[hidden] { display: none; }

@media (max-width: 760px) {
  .chrome, .layout { grid-template-columns: minmax(0, 1fr); }
  .a-top { flex-wrap: wrap; } .a-avail { margin-left: 0; width: 100%; text-align: left; }

  .lights { padding: 12px 16px; } .toolbar { display: none; }

}
</style>

// ---------- Fake data ----------

const CAT = {

const ICON = {
  hammer: '<path d="M15 12l-8.5 8.5a2.1 2.1 0 0 1-3-3L12 9"/><path d="M17.6 15L22 10.6"/><path d="M20.9 11.7l-1.3-1.3a2.4 2.4 0 0 1-.7-1.7V7.4l-2.3-2.3A5.6 5.6 0 0 0 12.6 3H9l.9.8A6.2 6.2 0 0 1 12 8.4v1.7l2 2h1.2a2.4 2.4 0 0 1 1.7.7l1.3 1.3"/>',

// ---------- Controls & URL ----------

// Draws used space as grey fill with the plan's items at the right tip, in reverse resolve order so the item being

function makeMeter(host, { size = 'prominent', lens = false } = {}) {

    const W = el.clientWidth, d = S.disk;

      p.style.left = (left + (gone ? 0 : gap)) + 'px';
