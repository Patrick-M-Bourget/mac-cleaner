name: CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The source checks scripts/check.sh runs first: no Xcode needed.
      # Test seams and process signals stay out of release builds (Decision 79).
      - name: Debug seams check
        run: scripts/check-debug-seams.sh
      # RESET.md merges by union (.gitattributes); a merge can leave Decisions out of order or doubled.
      - name: Decisions numbering check
        run: scripts/check-decisions.sh
      # Strings users see keep GLOSSARY's off-screen terms out (Decision 92).
      - name: Copy terms check
        run: scripts/check-copy.sh
      # Saved types pin their stored keys, so a rename keeps them (#448).
      - name: Stored keys check
        run: scripts/check-stored-keys.sh
      # Hosted runners don't list Xcode 27.x; local development uses 27.1.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: CacheDropCore tests
        run: xcrun swift test --package-path Packages/CacheDropCore
      # One cooperative thread: catches code that blocks the shared pool (#200).
      - name: CacheDropCore tests (strict pool)
        run: xcrun swift test --package-path Packages/CacheDropCore --skip aRunningToolLeavesTheConcurrencyPoolFree
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: '1'
      # The pool guard runs alone, so the rest of the suite can't hold the one thread it checks (#242).
      - name: Concurrency pool guard (strict pool, alone)
        run: xcrun swift test --package-path Packages/CacheDropCore --filter aRunningToolLeavesTheConcurrencyPoolFree
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: '1'
      - name: StorageAlerts tests
        run: xcrun swift test --package-path CacheDrop/Packages/StorageAlerts
      - name: Build app
        run: xcodebuild build -project CacheDrop/CacheDrop.xcodeproj -scheme CacheDrop -configuration Debug -destination 'platform=macOS' -derivedDataPath .build/xcode

      - name: Release exclusion check
        run: scripts/check-release.sh
