name: CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Hosted runners don't list Xcode 27.x; local development uses 27.1.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: CacheDropCore tests
        run: xcrun swift test --package-path Packages/CacheDropCore
      - name: StorageAlerts tests
        run: xcrun swift test --package-path CacheDrop/Packages/StorageAlerts
      - name: Build app
        run: xcodebuild build -project CacheDrop/CacheDrop.xcodeproj -scheme CacheDrop -configuration Debug -destination 'platform=macOS' -derivedDataPath .build/xcode
