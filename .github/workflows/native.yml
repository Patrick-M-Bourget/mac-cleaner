name: Native Mac workspace
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Native journey scope (push and pull requests always run all)
        type: choice
        default: all
        options:
          - all
          - exclusions
          - design
          - selection
          - selection-scroll
          - scope
          - repair
          - handoff
          - tools
          - benchmark
permissions:
  contents: read
jobs:
  native:
    if: github.event_name != 'workflow_dispatch' || inputs.suite != 'benchmark'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Verify disposable scanner boundaries
        if: github.event_name != 'workflow_dispatch' || (inputs.suite != 'selection' && inputs.suite != 'selection-scroll' && inputs.suite != 'scope' && inputs.suite != 'exclusions' && inputs.suite != 'repair' && inputs.suite != 'handoff')
        run: xcrun swift test --package-path Packages/StillCore
      - name: Verify alert policies and lifecycle without OS permission prompts
        if: github.event_name != 'workflow_dispatch' || (inputs.suite != 'selection' && inputs.suite != 'selection-scroll' && inputs.suite != 'scope' && inputs.suite != 'exclusions' && inputs.suite != 'repair' && inputs.suite != 'handoff' && inputs.suite != 'tools')
        run: xcrun swift test --package-path Still/Packages/StorageAlerts
      - name: Verify isolated disposable adapter investigations
        if: github.event_name != 'workflow_dispatch' || (inputs.suite != 'selection' && inputs.suite != 'selection-scroll' && inputs.suite != 'scope' && inputs.suite != 'exclusions' && inputs.suite != 'repair' && inputs.suite != 'handoff' && inputs.suite != 'tools')
        run: |
          xcrun swift test --package-path Validation/ICloudProbe
          xcrun swift test --package-path Validation/XcodeProbe
          xcrun swift test --package-path Validation/ChromeProbe
          xcrun swift test --package-path Validation/SafariProbe
      - name: Build runnable Mac application and UI runner
        run: xcodebuild build-for-testing -project Still/Still.xcodeproj -scheme Still -destination 'platform=macOS' -derivedDataPath .build/xcode
      - name: Exercise fixture navigation and geometry
        env:
          REQUESTED_SUITE: ${{ inputs.suite }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          scope=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "exclusions" ]]; then
            scope=(-only-testing:StillUITests/ExclusionsUITests)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "tools" ]]; then
            scope=(
              -only-testing:StillUITests/StorageAlertsUITests/testFutureDockerReportKeepsHostCapacityAndPersistentDataDistinct
              -only-testing:StillUITests/StorageAlertsUITests/testFuturePipInventoryShowsRecordedQualificationWithoutRunningPersonalTools
              -only-testing:StillUITests/StorageAlertsUITests/testSelectedPipCacheInventoryIsReadOnlyAcrossThemesAndSizes
            )
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "handoff" ]]; then
            scope=(-only-testing:StillUITests/WorkspaceUITests/testNativeDesignReviewAndMinimumGalleryCaptures)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "repair" ]]; then
            scope=(
              -only-testing:StillUITests/ExclusionsUITests
              -only-testing:StillUITests/WorkspaceUITests/testRefreshPreservesChoicesAndSearchThenExplainsChangedTargets
            )
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "scope" ]]; then
            scope=(-only-testing:StillUITests/WorkspaceUITests/testDownloadsScopeGuidanceAndShortcutPreserveInspection)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "selection-scroll" ]]; then
            scope=(-only-testing:StillUITests/WorkspaceUITests/testScrolledCategorySelectionKeepsContentAnchored)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "selection" ]]; then
            scope=(
              -only-testing:StillUITests/WorkspaceUITests/testCheckboxSelectionKeepsContentAnchored
              -only-testing:StillUITests/WorkspaceUITests/testInspectionCheckboxSelectionKeepsContentAnchored
              -only-testing:StillUITests/WorkspaceUITests/testScrolledCategorySelectionKeepsContentAnchored
            )
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "design" ]]; then
            scope=(
              -only-testing:StillUITests/WorkspaceUITests/testDesignReviewCaptures
              -only-testing:StillUITests/WorkspaceUITests/testNativeDesignReviewAndMinimumGalleryCaptures
              -only-testing:StillUITests/WorkspaceUITests/testMinimumGalleryStatesAndOpaqueChromeCaptures
              -only-testing:StillUITests/WorkspaceUITests/testMinimumPopulatedPlanAndConfirmationRemainReachable
              -only-testing:StillUITests/WorkspaceUITests/testKeyboardNavigationAndAppearanceKeepWindowBounds
              -only-testing:StillUITests/WorkspaceUITests/testInitialReviewWindowFitsConstrainedDisplayAndKeepsToolbarReachable
              -only-testing:StillUITests/WorkspaceUITests/testRefreshPreservesChoicesAndSearchThenExplainsChangedTargets
            )
          fi
          xcodebuild test-without-building -project Still/Still.xcodeproj -scheme Still -destination 'platform=macOS' -derivedDataPath .build/xcode -resultBundlePath .build/Workspace.xcresult "${scope[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: .build/Workspace.xcresult
          if-no-files-found: ignore
  million-entry:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'benchmark'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Record reference environment
        run: |
          mkdir -p .build/benchmark-evidence
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          report = {
              'sourceCommit': os.environ['GITHUB_SHA'],
              'runURL': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'architecture': platform.machine(),
              'os': subprocess.check_output(['sw_vers'], text=True),
              'xcode': subprocess.check_output(['xcodebuild', '-version'], text=True),
              'hardware': subprocess.check_output(['sysctl', 'hw.model', 'hw.memsize', 'hw.ncpu'], text=True),
              'reference512GBHost': False,
          }
          Path('.build/benchmark-evidence/environment.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Build bounded benchmark
        run: xcrun swift build -c release --package-path Validation/ScanBenchmark
      - name: Run owned million-entry fixture with existing headroom safeguards
        run: |
          Validation/ScanBenchmark/.build/release/ScanBenchmark --entries 1000000 > .build/benchmark-evidence/million.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.build/benchmark-evidence/million.json').read_text())
          print(json.dumps(report, indent=2))
          if report.get('status') != 'completed-owned-fixture-benchmark':
              raise SystemExit('Benchmark declined or incomplete; do not claim million-entry qualification.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-scanner-benchmark
          path: .build/benchmark-evidence/
          if-no-files-found: error
