name: Native Mac workspace
run-name: "Native Mac · ${{ inputs.suite || 'all' }} · ${{ github.ref_name }}"
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Native journey scope (push and pull requests always run all)
        type: choice
        default: all
        options:
          - all
          - downloads
          - downloads-journey
          - downloads-regressions
          - downloads-refresh
          - downloads-unavailable
          - mixed-scopes
          - mixed-scopes-initial
          - mixed-scopes-minimum
          - inspector
          - connected-next
          - history
          - local-records
          - local-records-regressions
          - recovery-caller
          - recovery-context
          - recovery-context-initial
          - terminal-gallery
          - terminal-results
          - terminal-skipped
          - access-guide
          - selection-plan
          - exclusions
          - design
          - selection
          - selection-scroll
          - scope
          - repair
          - handoff
          - tools
          - pip
          - benchmark
          - homebrew
          - keyboard
          - alerts
          - alert-open
          - overview
          - overview-main
          - alerts-native
          - filesystem
          - chrome-probe
permissions:
  contents: read
jobs:
  native:
    if: github.event_name != 'workflow_dispatch' || (inputs.suite != 'benchmark' && inputs.suite != 'filesystem' && inputs.suite != 'chrome-probe' && inputs.suite != 'alerts-native')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Verify disposable scanner boundaries
        if: github.event_name != 'workflow_dispatch' || (inputs.suite != 'selection' && inputs.suite != 'selection-scroll' && inputs.suite != 'scope' && inputs.suite != 'exclusions' && inputs.suite != 'repair' && inputs.suite != 'handoff' && inputs.suite != 'history' && inputs.suite != 'local-records' && inputs.suite != 'local-records-regressions' && inputs.suite != 'pip' && inputs.suite != 'keyboard' && inputs.suite != 'alerts' && inputs.suite != 'alert-open' && inputs.suite != 'overview' && inputs.suite != 'overview-main')
        run: xcrun swift test --package-path Packages/StillCore
      - name: Verify alert policies and lifecycle without OS permission prompts
        if: github.event_name != 'workflow_dispatch' || (inputs.suite != 'selection' && inputs.suite != 'selection-scroll' && inputs.suite != 'scope' && inputs.suite != 'exclusions' && inputs.suite != 'repair' && inputs.suite != 'handoff' && inputs.suite != 'history' && inputs.suite != 'local-records' && inputs.suite != 'local-records-regressions' && inputs.suite != 'tools' && inputs.suite != 'pip' && inputs.suite != 'homebrew' && inputs.suite != 'keyboard' && inputs.suite != 'overview' && inputs.suite != 'overview-main' && inputs.suite != 'downloads' && inputs.suite != 'downloads-journey')
        run: xcrun swift test --package-path Still/Packages/StorageAlerts
      - name: Verify isolated disposable adapter investigations
        if: github.event_name != 'workflow_dispatch' || (inputs.suite != 'selection' && inputs.suite != 'selection-scroll' && inputs.suite != 'scope' && inputs.suite != 'exclusions' && inputs.suite != 'repair' && inputs.suite != 'handoff' && inputs.suite != 'history' && inputs.suite != 'local-records' && inputs.suite != 'local-records-regressions' && inputs.suite != 'tools' && inputs.suite != 'pip' && inputs.suite != 'homebrew' && inputs.suite != 'keyboard' && inputs.suite != 'alerts' && inputs.suite != 'alert-open' && inputs.suite != 'overview' && inputs.suite != 'overview-main' && inputs.suite != 'downloads' && inputs.suite != 'downloads-journey')
        run: |
          xcrun swift test --package-path Validation/ICloudProbe
          xcrun swift test --package-path Validation/XcodeProbe
          xcrun swift test --package-path Validation/ChromeProbe
          xcrun swift test --package-path Validation/SafariProbe
      - name: Fit review window on the ephemeral native display
        if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'downloads' || inputs.suite == 'downloads-journey')
        run: xcrun swift Validation/NativeDisplay.swift
      - name: Build runnable Mac application and UI runner
        run: xcodebuild build-for-testing -project Still/Still.xcodeproj -scheme Still -destination 'platform=macOS' -derivedDataPath .build/xcode
      - name: Exercise fixture navigation and geometry
        env:
          REQUESTED_SUITE: ${{ inputs.suite }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          scope=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "downloads-journey" ]]; then
            scope=(
              -only-testing:StillUITests/WorkspaceUITests/testPlanStartsWithContextualDownloadsCategoryAndNoSetupDetour
              -only-testing:StillUITests/WorkspaceUITests/testConnectedDownloadsJourneyPreservesContextAndConsumesPlan
              -only-testing:StillUITests/WorkspaceUITests/testMinimumConnectedDownloadsJourneyPreservesContextAndConsumesPlan
              -only-testing:StillUITests/WorkspaceUITests/testMinimumGalleryStatesAndOpaqueChromeCaptures
            )
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "downloads" ]]; then
            scope=(
              -only-testing:StillUITests/WorkspaceUITests/testPlanStartsWithContextualDownloadsCategoryAndNoSetupDetour
              -only-testing:StillUITests/WorkspaceUITests/testConnectedDownloadsJourneyPreservesContextAndConsumesPlan
              -only-testing:StillUITests/WorkspaceUITests/testMinimumConnectedDownloadsJourneyPreservesContextAndConsumesPlan
              -only-testing:StillUITests/WorkspaceUITests/testMinimumGalleryStatesAndOpaqueChromeCaptures
              -only-testing:StillUITests/WorkspaceUITests/testDownloadsScopeGuidanceAndShortcutPreserveInspection
              -only-testing:StillUITests/WorkspaceUITests/testUnavailableSelectedFolderShowsUnknownCoverageAndRecovery
              -only-testing:StillUITests/WorkspaceUITests/testRefreshPreservesChoicesAndSearchThenExplainsChangedTargets
              -only-testing:StillUITests/WorkspaceUITests/testScrolledCategorySelectionKeepsContentAnchored
              -only-testing:StillUITests/WorkspaceUITests/testCheckboxSelectionKeepsContentAnchored
              -only-testing:StillUITests/WorkspaceUITests/testInspectionCheckboxSelectionKeepsContentAnchored
              -only-testing:StillUITests/WorkspaceUITests/testKeyboardCancelRestoresReviewFocusWithoutChangingSelection
              -only-testing:StillUITests/CleanupRetryUITests
            )
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "access-guide" ]]; then
            scope=(-only-testing:StillUITests/WorkspaceUITests/testOptionalFolderAccessEducationPreservesScopeAndSelection)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "recovery-context" ]]; then
            scope=(-only-testing:StillUITests/RecoveryUITests/testHistoryRecoveryPreservesExpandedEvidenceAndObservedViewport)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "recovery-context-initial" ]]; then
            scope=(-only-testing:StillUITests/RecoveryUITests/testInitialHistoryRecoveryPreservesExpandedEvidenceAndObservedViewport)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "terminal-gallery" ]]; then
            scope=(-only-testing:StillUITests/CleanupRetryUITests/testSyntheticOutcomeGalleryAtInitialSize -only-testing:StillUITests/CleanupRetryUITests/testSyntheticOutcomeGalleryAtMinimumSize)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "terminal-skipped" ]]; then
            scope=(-only-testing:StillUITests/CleanupRetryUITests/testChangedConfirmedFileReportsNoFilesMoved)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "local-records-regressions" ]]; then
            scope=(
              -only-testing:StillUITests/RecoveryUITests/testManualHistoryRecoveryReturnsToHistoryWithoutChangingFacts
              -only-testing:StillUITests/RecoveryUITests/testStartupRecoveryRetainsUnknownFactsAndNeverRestoresPlan
              -only-testing:StillUITests/CleanupRetryUITests/testCancelledBatchRequiresFreshRetryApproval
              -only-testing:StillUITests/WorkspaceUITests/testConnectedDownloadsJourneyPreservesContextAndConsumesPlan
              -only-testing:StillUITests/WorkspaceUITests/testMinimumConnectedDownloadsJourneyPreservesContextAndConsumesPlan
              -only-testing:StillUITests/WorkspaceUITests/testOptionalFolderAccessEducationPreservesScopeAndSelection
            )
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "local-records" ]]; then
            scope=(-only-testing:StillUITests/HistoryUITests/testLocalRecordsUsesBothCallersAndClearPreservesOriginals)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "history" ]]; then
            scope=(-only-testing:StillUITests/HistoryUITests)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "recovery-caller" ]]; then
            scope=(-only-testing:StillUITests/RecoveryUITests/testManualHistoryRecoveryReturnsToHistoryWithoutChangingFacts)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "terminal-results" ]]; then
            scope=(-only-testing:StillUITests/CleanupRetryUITests)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "connected-next" ]]; then
            scope=(
              -only-testing:StillUITests/WorkspaceUITests/testMixedLocationsKeepValidChoicesWithUnknownCoverage
              -only-testing:StillUITests/WorkspaceUITests/testMinimumMixedLocationsKeepValidChoicesWithUnknownCoverage
              -only-testing:StillUITests/WorkspaceUITests/testInspectorExplainsOwnedDownloadsCandidateWithoutSelectingIt
              -only-testing:StillUITests/WorkspaceUITests/testInspectorExplainsOwnedInspectionOnlyAndProtectedEntries
              -only-testing:StillUITests/WorkspaceUITests/testMinimumGalleryStatesAndOpaqueChromeCaptures
            )
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "mixed-scopes-initial" ]]; then
            scope=(-only-testing:StillUITests/WorkspaceUITests/testMixedLocationsKeepValidChoicesWithUnknownCoverage)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "mixed-scopes-minimum" ]]; then
            scope=(-only-testing:StillUITests/WorkspaceUITests/testMinimumMixedLocationsKeepValidChoicesWithUnknownCoverage)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "mixed-scopes" ]]; then
            scope=(
              -only-testing:StillUITests/WorkspaceUITests/testMixedLocationsKeepValidChoicesWithUnknownCoverage
              -only-testing:StillUITests/WorkspaceUITests/testMinimumMixedLocationsKeepValidChoicesWithUnknownCoverage
            )
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "inspector" ]]; then
            scope=(
              -only-testing:StillUITests/WorkspaceUITests/testInspectorExplainsOwnedDownloadsCandidateWithoutSelectingIt
              -only-testing:StillUITests/WorkspaceUITests/testInspectorExplainsOwnedInspectionOnlyAndProtectedEntries
            )
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "downloads-unavailable" ]]; then
            scope=(-only-testing:StillUITests/WorkspaceUITests/testUnavailableSelectedFolderShowsUnknownCoverageAndRecovery)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "downloads-refresh" ]]; then
            scope=(-only-testing:StillUITests/WorkspaceUITests/testRefreshPreservesChoicesAndSearchThenExplainsChangedTargets)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "selection-plan" ]]; then
            scope=(-only-testing:StillUITests/WorkspaceUITests/testCheckboxSelectionKeepsContentAnchored)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "downloads-regressions" ]]; then
            scope=(
              -only-testing:StillUITests/RecoveryUITests
              -only-testing:StillUITests/WorkspaceUITests/testCompletedGrowthUsesExplicitScopesAndShowsUnknownForUnmeasuredCoverage
              -only-testing:StillUITests/WorkspaceUITests/testOverviewFindingsRestoreHierarchyAndPreserveReviewChoices
            )
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "exclusions" ]]; then
            scope=(-only-testing:StillUITests/ExclusionsUITests)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "overview-main" ]]; then
            scope=(-only-testing:StillUITests/WorkspaceUITests/testOverviewFindingsRestoreHierarchyAndPreserveReviewChoices)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "overview" ]]; then
            scope=(
              -only-testing:StillUITests/WorkspaceUITests/testOverviewFindingsRestoreHierarchyAndPreserveReviewChoices
              -only-testing:StillUITests/WorkspaceUITests/testOverviewSecondaryToolsRemainReachable
              -only-testing:StillUITests/CleanupRetryUITests
              -only-testing:StillUITests/WorkspaceUITests/testInspectingFixturesPreservesWindowAndNeverSelects
              -only-testing:StillUITests/WorkspaceUITests/testDownloadsScopeGuidanceAndShortcutPreserveInspection
              -only-testing:StillUITests/WorkspaceUITests/testRefreshPreservesChoicesAndSearchThenExplainsChangedTargets
              -only-testing:StillUITests/StorageAlertsUITests/testOpenedAlertPreservesContextAndOffersOnlyExplicitScanAcrossThemesAndSizes
            )
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "alert-open" ]]; then
            scope=(-only-testing:StillUITests/StorageAlertsUITests/testOpenedAlertPreservesContextAndOffersOnlyExplicitScanAcrossThemesAndSizes)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "alerts" ]]; then
            scope=(
              -only-testing:StillUITests/StorageAlertsUITests/testAlertsAreHiddenByDefaultAndFutureSettingsDoNotRequestPermission
              -only-testing:StillUITests/StorageAlertsUITests/testOnDemandWindowCloseTerminatesAndLoginControlsAreReadOnlyUntilChoice
              -only-testing:StillUITests/StorageAlertsUITests/testDisposableAlertOptInExplainsRefusalWithoutChangingOSAuthorization
            )
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "keyboard" ]]; then
            scope=(-only-testing:StillUITests/WorkspaceUITests/testKeyboardCancelRestoresReviewFocusWithoutChangingSelection)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "homebrew" ]]; then
            scope=(
              -only-testing:StillUITests/StorageAlertsUITests/testFutureHomebrewPreviewIsSecondaryAndClearlySynthetic
              -only-testing:StillUITests/StorageAlertsUITests/testSelectedHomebrewCacheInventoryIsReadOnlyAcrossThemesAndSizes
            )
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "pip" ]]; then
            scope=(-only-testing:StillUITests/StorageAlertsUITests/testSelectedPipCacheInventoryIsReadOnlyAcrossThemesAndSizes)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "tools" ]]; then
            scope=(
              -only-testing:StillUITests/StorageAlertsUITests/testFutureDockerReportKeepsHostCapacityAndPersistentDataDistinct
              -only-testing:StillUITests/StorageAlertsUITests/testFuturePipInventoryShowsRecordedQualificationWithoutRunningPersonalTools
              -only-testing:StillUITests/StorageAlertsUITests/testSelectedPipCacheInventoryIsReadOnlyAcrossThemesAndSizes
            )
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "handoff" ]]; then
            scope=(-only-testing:StillUITests/WorkspaceUITests/testNativeDesignReviewAndMinimumGalleryCaptures)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "repair" ]]; then
            scope=(
              -only-testing:StillUITests/ExclusionsUITests
              -only-testing:StillUITests/WorkspaceUITests/testRefreshPreservesChoicesAndSearchThenExplainsChangedTargets
            )
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "scope" ]]; then
            scope=(-only-testing:StillUITests/WorkspaceUITests/testDownloadsScopeGuidanceAndShortcutPreserveInspection)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "selection-scroll" ]]; then
            scope=(-only-testing:StillUITests/WorkspaceUITests/testScrolledCategorySelectionKeepsContentAnchored)
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "selection" ]]; then
            scope=(
              -only-testing:StillUITests/WorkspaceUITests/testCheckboxSelectionKeepsContentAnchored
              -only-testing:StillUITests/WorkspaceUITests/testInspectionCheckboxSelectionKeepsContentAnchored
              -only-testing:StillUITests/WorkspaceUITests/testScrolledCategorySelectionKeepsContentAnchored
            )
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SUITE" == "design" ]]; then
            scope=(
              -only-testing:StillUITests/WorkspaceUITests/testDesignReviewCaptures
              -only-testing:StillUITests/WorkspaceUITests/testNativeDesignReviewAndMinimumGalleryCaptures
              -only-testing:StillUITests/WorkspaceUITests/testMinimumGalleryStatesAndOpaqueChromeCaptures
              -only-testing:StillUITests/WorkspaceUITests/testMinimumPopulatedPlanAndConfirmationRemainReachable
              -only-testing:StillUITests/WorkspaceUITests/testKeyboardNavigationAndAppearanceKeepWindowBounds
              -only-testing:StillUITests/WorkspaceUITests/testInitialReviewWindowFitsConstrainedDisplayAndKeepsToolbarReachable
              -only-testing:StillUITests/WorkspaceUITests/testRefreshPreservesChoicesAndSearchThenExplainsChangedTargets
            )
          fi
          xcodebuild test-without-building -project Still/Still.xcodeproj -scheme Still -destination 'platform=macOS' -derivedDataPath .build/xcode -resultBundlePath .build/Workspace.xcresult "${scope[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: .build/Workspace.xcresult
          if-no-files-found: ignore
  native-alert-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'alerts-native'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Build actual application and guarded native journey without launching
        run: xcodebuild build-for-testing -project Still/Still.xcodeproj -scheme Still -destination 'platform=macOS' -derivedDataPath .build/alerts-native
      - name: Verify fresh hosted identity and inject the observed UI runner environment
        env:
          REQUESTED_SUITE: ${{ inputs.suite }}
        run: python3 Validation/AlertsNative/prepare.py
      - name: Attempt one visible native opt-in and window lifecycle journey
        run: xcodebuild test-without-building -xctestrun .build/alerts-native/Build/Products/Still-alerts-native.xctestrun -destination 'platform=macOS' -resultBundlePath .build/AlertsNative.xcresult -only-testing:StillUITests/NativeAlertsQualificationUITests/testRealOptInMonitoringAndWindowLifecycleOnFreshHostedRunner
      - name: Require an executed native journey rather than a skipped guard
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path .build/AlertsNative.xcresult --format json > .build/alerts-native-summary.json
          xcrun xcresulttool export attachments --path .build/AlertsNative.xcresult --output-path .build/alerts-native-attachments
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          summary = json.loads(Path('.build/alerts-native-summary.json').read_text())
          directory = Path('.build/alerts-native-attachments')
          attachments = json.loads((directory / 'manifest.json').read_text())
          reports = [item for test in attachments for item in test.get('attachments', [])
                     if item.get('suggestedHumanReadableName', '').startswith('Native alert journey JSON')]
          environments = list(Path(os.environ['RUNNER_TEMP']).glob('still-alerts-native-*/environment.json'))
          if len(reports) != 1 or len(environments) != 1:
              raise SystemExit('Native qualification unavailable: expected one guarded journey attachment and manifest.')
          name = reports[0]['exportedFileName']
          if Path(name).name != name:
              raise SystemExit('Unexpected exported attachment filename.')
          journey = json.loads((directory / name).read_text())
          environment = json.loads(environments[0].read_text())
          if any(journey.get(key) != environment.get(key) for key in ('probeID', 'sourceCommit')):
              raise SystemExit('Journey identity does not match prepared source/probe manifest.')
          Path('.build/alerts-native-journey.json').write_text(json.dumps(journey, indent=2) + '\n')
          print(json.dumps({'summary': summary, 'journey': journey}, indent=2))
          if not (summary.get('passedTests') == 1 and summary.get('failedTests') == 0 and summary.get('skippedTests') == 0
                  and journey.get('outcome') == 'native-opt-in-and-window-lifecycle-passed'):
              raise SystemExit('Native journey unsupported or failed; this run does not qualify the feature.')
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-alert-qualification
          path: |
            .build/AlertsNative.xcresult
            .build/alerts-native-summary.json
            .build/alerts-native-journey.json
            .build/alerts-native-attachments/
            ${{ runner.temp }}/still-alerts-native-*/
          if-no-files-found: error
  million-entry:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'benchmark'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Record reference environment
        run: |
          mkdir -p .build/benchmark-evidence
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          report = {
              'sourceCommit': os.environ['GITHUB_SHA'],
              'runURL': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'architecture': platform.machine(),
              'os': subprocess.check_output(['sw_vers'], text=True),
              'xcode': subprocess.check_output(['xcodebuild', '-version'], text=True),
              'hardware': subprocess.check_output(['sysctl', 'hw.model', 'hw.memsize', 'hw.ncpu'], text=True),
              'reference512GBHost': False,
          }
          Path('.build/benchmark-evidence/environment.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Build bounded benchmark
        run: xcrun swift build -c release --package-path Validation/ScanBenchmark
      - name: Run owned million-entry fixture with existing headroom safeguards
        run: |
          Validation/ScanBenchmark/.build/release/ScanBenchmark --entries 1000000 > .build/benchmark-evidence/million.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.build/benchmark-evidence/million.json').read_text())
          print(json.dumps(report, indent=2))
          if report.get('status') != 'completed-owned-fixture-benchmark':
              raise SystemExit('Benchmark declined or incomplete; do not claim million-entry qualification.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-scanner-benchmark
          path: .build/benchmark-evidence/
          if-no-files-found: error
  filesystem-fixtures:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'filesystem'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Build public scanner filesystem fixture
        run: xcrun swift build -c release --package-path Validation/FilesystemFixtures
      - name: Exercise only an owned disposable image on the ephemeral runner
        run: python3 Validation/FilesystemFixtures/run.py --ci-owned-images --executable Validation/FilesystemFixtures/.build/release/FilesystemFixtures --reports "$RUNNER_TEMP/filesystem-fixture-reports"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filesystem-fixture-evidence
          path: ${{ runner.temp }}/filesystem-fixture-reports/
          if-no-files-found: error
  genuine-chrome-fixtures:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'chrome-probe'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fixture policy boundaries
        run: |
          xcrun swift test --package-path Validation/ChromeProbe
          python3 -m unittest discover -s Validation/ChromeProbe -p 'test_owned_cache.py'
          node --check Validation/ChromeProbe/genuine.mjs
      - name: Provision the pinned browser only in the ephemeral runner cache
        run: python3 Validation/ChromeProbe/provision.py "$RUNNER_TEMP/chrome-probe"
      - name: Exercise genuine owned profiles and exact asset-cache boundaries
        run: node Validation/ChromeProbe/genuine.mjs "$RUNNER_TEMP/chrome-probe/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing" "$RUNNER_TEMP/chrome-probe/evidence/report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genuine-chrome-fixture-evidence
          path: ${{ runner.temp }}/chrome-probe/evidence/
          if-no-files-found: error
